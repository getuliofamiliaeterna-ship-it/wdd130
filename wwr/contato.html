<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fale Conosco | Rio Abaixo Rafting</title>

    <meta name="description"
      content="Entre em contato com a Rio Abaixo Rafting para informações sobre passeios, reservas e aventuras de rafting.">

    <meta name="author" content="Getulio da Silva Carvalho Junior">

    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>
        <img src="imagens/logo.png" alt="Logotipo do site de rafting">

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>

    </header>

    <main>
        <section class="cabecalho-contato">
            <h1>Fale Conosco | Rio Abaixo Rafting</h1>
            <p>Brasília, Distrito Federal, Brasil</p>
            <p>(61) 3333-2026</p>
            <p>contato@rioabaixorafting.com</p>
        </section>

        <section class="contato">
            <div class="mapa-contato">
                <iframe src="https://www.google.com/maps?q=Brasilia%20DF&output=embed" width="400"
                  height="350" loading="lazy" title="Localização da Rio Abaixo Rafting">
                </iframe>
            </div>

            <div class="formulario-contato">
                <form>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                    <fieldset>
                        <legend>Qual é o propósito da sua mensagem?</legend>

                        <div class="opcao-radio">
                            <input type="radio" id="consulta" name="proposito" value="consulta">
                            <label for="consulta">Consulta Geral</label>
                        </div>

                        <div class="opcao-radio">
                            <input type="radio" id="reserva" name="proposito" value="reserva">
                            <label for="reserva">Pergunta sobre Reserva</label>
                        </div>

                        <div class="opcao-radio">
                            <input type="radio" id="site" name="proposito" value="site">
                            <label for="site">Sugestão de Site</label>
                        </div>
                    </fieldset>

                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5"></textarea>

                    <label class="newsletter" for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Quero receber a newsletter mensal
                    </label>

                    <button type="submit">Entre em Contato!</button>
                </form>
            </div>
        </section>

        <section class="equipe">
            <h2>Estamos Aqui para Atender Você</h2>

            <div class="funcionarios">
                <figure>
                    <img src="imagens/clientes.jpg" alt="Guia da equipe de rafting">
                    <figcaption>Lucas Silva - Guia de Rafting</figcaption>
                </figure>

                <figure>
                    <img src="imagens/rafting15_1024.jpg" alt="Instrutor da equipe de rafting">
                    <figcaption>Marcos Oliveira - Instrutor de Rafting</figcaption>
                </figure>

                <figure>
                    <img src="imagens/rafting18_600.jpg" alt="Coordenadora da equipe de rafting">
                    <figcaption>Ana Costa - Coordenadora de Aventuras</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 | Rio Abaixo Rafting | Getulio da Silva Carvalho Junior</p>

        <nav class="socialmedia redes-sociais">
            <a href="https://facebook.com">
                <img src="imagens/facebook.svg" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="imagens/linkedin.svg" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="imagens/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
